name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Configuration
        run: |
          if [ -z "${{ vars.APPS_SCRIPT_URL }}" ]; then
            echo "::error::APPS_SCRIPT_URL variable is missing! Please define it in Repository Settings -> Secrets and variables -> Actions -> Variables"
            exit 1
          fi

      - name: Generate config.js
        run: |
          echo "window.CONFIG = {" > config.js
          echo "  APPS_SCRIPT_URL: '${{ vars.APPS_SCRIPT_URL }}'" >> config.js
          echo "};" >> config.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
